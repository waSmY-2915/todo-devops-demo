---
- name: Make sure the jar has been built
  ansible.builtin.stat:
    path: "{{ app_jar_src }}"
  delegate_to: localhost
  become: false
  register: jar_file

- name: Fail early with a helpful message if the jar is missing
  ansible.builtin.assert:
    that: jar_file.stat.exists
    fail_msg: "{{ app_jar_src }} not found - run 'make build' first"

- name: Install Java runtime
  ansible.builtin.apt:
    name: "{{ java_package }}"
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Create service group
  ansible.builtin.group:
    name: "{{ app_group }}"
    system: true

- name: Create service user
  ansible.builtin.user:
    name: "{{ app_user }}"
    group: "{{ app_group }}"
    system: true
    shell: /usr/sbin/nologin
    create_home: false

- name: Create install directory
  ansible.builtin.file:
    path: "{{ install_dir }}"
    state: directory
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0755"

- name: Copy application jar
  ansible.builtin.copy:
    src: "{{ app_jar_src }}"
    dest: "{{ install_dir }}/todo-api.jar"
    owner: "{{ app_user }}"
    group: "{{ app_group }}"
    mode: "0644"
  notify: Restart todo-api

- name: Install systemd unit
  ansible.builtin.template:
    src: todo-api.service.j2
    dest: /etc/systemd/system/todo-api.service
    mode: "0644"
  notify:
    - Reload systemd
    - Restart todo-api

- name: Enable and start the service
  ansible.builtin.systemd:
    name: todo-api
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for the app port
  ansible.builtin.wait_for:
    port: "{{ app_port }}"
    delay: 3
    timeout: 90

- name: Check the health endpoint
  ansible.builtin.uri:
    url: "http://localhost:{{ app_port }}/health"
    return_content: true
  register: health
  retries: 10
  delay: 3
  until: health.status == 200
